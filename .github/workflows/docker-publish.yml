name: Build and Deploy Simulator

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme çalıştırması: yalnızca kontrol et, dağıtma/yeniden başlatma"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,value=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    if: ${{ always() && needs.build-and-push.result != 'failure' && needs.build-and-push.result != 'cancelled' }}
    # ikincil-pc (WSL2) üzerindeki self-hosted runner
    runs-on: [self-hosted, ikincil-pc]
    concurrency:
      group: deploy-ikincil-pc-simulator
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy (ikincil-pc, systemd)
        env:
          APP: simulator
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: bash .github/deploy/ikincil-pc.sh
